name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: quant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quant_test" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      QUANT_DATABASE_URL: postgresql://quant_test:ci_local_only@127.0.0.1:5432/quant_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --basetemp=.runtime/pytest
