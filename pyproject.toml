[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-local"
version = "0.1.0"
description = "Local TDX research workstation, PostgreSQL and MCP"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "mcp>=1.20,<2", "python-dotenv>=1,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pandas==2.2.3", "numpy==1.26.4", "python-dateutil==2.9.0.post0", "pypdf>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant = ["migrations/*.sql", "static/*", "static/vendor/*", "tdx/*.hex", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"
